  <script>
    document.getElementById('createdDate').valueAsDate = new Date();

    // --- Contract number generation ---
    function generateContractNo() {
        const company = document.querySelector('input[name="company"]:checked').value;
        const docType = document.getElementById('documentType').value;
        const partner = document.getElementById('partnerShortName').value.toUpperCase() || '[ĐỐI-TÁC]';
        const year = new Date().getFullYear();
        let code = '';
        if (docType === 'HDNT') code = `05/${year}/HĐNT/${partner}-${company}`;
        else if (docType === 'HDMB') code = `01/${year}/HĐMB/${partner}-${company}`;
        else if (docType === 'DDH') code = `01/${partner}-${company}`;
        else if (docType === 'BBBG') code = `BBBG/${partner}-${company}`;
        else if (docType === 'BBCC') code = `BBCC/${partner}-${company}`;
        document.getElementById('contractNo').value = code;
    }

    // --- Dynamic field visibility ---
    const fieldRules = {
        HDNT: ['field-legal','field-bank','field-ref','field-m01','field-payment','field-delivery','field-table'],
        HDMB: ['field-legal','field-bank','field-ref','field-deposit','field-payment','field-delivery','field-table'],
        DDH:  ['field-payment','field-delivery','field-table'],
        BBBG: ['field-ref','field-delivery','field-table'],
        BBCC: ['field-legal','field-m05','field-ref']
    };

    function handleFormChange() {
        generateContractNo();
        const docType = document.getElementById('documentType').value;
        const visibleClasses = fieldRules[docType] || [];

        // Hide all conditional fields
        document.querySelectorAll('.cfield, .cfield-block').forEach(el => el.classList.remove('visible'));

        // Show relevant ones
        visibleClasses.forEach(cls => {
            document.querySelectorAll('.' + cls).forEach(el => el.classList.add('visible'));
        });

        // Toggle required on legal fields
        const needsLegal = ['HDNT','HDMB','BBCC'].includes(docType);
        document.getElementById('buyerRep').toggleAttribute('required', needsLegal);
        document.getElementById('buyerRole').toggleAttribute('required', needsLegal);

        // Hide price columns for BBBG
        document.querySelectorAll('.col-price').forEach(el => {
            el.style.display = docType === 'BBBG' ? 'none' : '';
        });
    }

    document.getElementById('documentType').addEventListener('change', handleFormChange);
    document.getElementById('partnerShortName').addEventListener('input', generateContractNo);
    document.querySelectorAll('input[name="company"]').forEach(r => r.addEventListener('change', handleFormChange));

    // --- Automatic totals and Vietnamese number words ---
    function formatMoney(value) { return new Intl.NumberFormat('vi-VN').format(Math.round(value)); }
    const numberWords = ['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
    function readThreeDigits(n, full) {
        const h = Math.floor(n / 100), t = Math.floor((n % 100) / 10), u = n % 10; let s = '';
        if (full || h) { s += numberWords[h] + ' trăm'; if (!t && u) s += ' lẻ'; }
        if (t > 1) s += ' ' + numberWords[t] + ' mươi'; else if (t === 1) s += ' mười';
        if (u) s += (t > 1 && u === 1 ? ' mốt' : t > 0 && u === 5 ? ' lăm' : ' ' + numberWords[u]);
        return s;
    }
    function docSoTiengViet(value) {
        value = Math.round(value); if (!value) return 'Không đồng';
        const units = ['', ' nghìn', ' triệu', ' tỷ']; let n = value, parts = [], i = 0;
        while (n > 0) { const block = n % 1000; if (block) parts.unshift(readThreeDigits(block, n >= 1000) + units[i]); n = Math.floor(n / 1000); i++; }
        return parts.join(' ').replace(/^./, c => c.toUpperCase()) + ' đồng chẵn';
    }
    function calculateTotals() {
        let subtotal = 0;
        document.querySelectorAll('#productBody tr').forEach(row => {
            const qty = parseFloat(row.querySelector('[name="prodQty[]"]').value) || 0;
            const price = parseFloat(row.querySelector('[name="prodPrice[]"]').value) || 0;
            const discount = parseFloat(row.querySelector('[name="prodDiscount[]"]').value) || 0;
            const amount = qty * price * (1 - discount / 100); subtotal += amount;
            const output = row.querySelector('[name="prodSubtotal[]"]'); if (output) output.value = formatMoney(amount);
        });
        const vat = subtotal * ((parseFloat(document.getElementById('vatRate').value) || 0) / 100);
        const grand = Math.round(subtotal + vat);
        document.getElementById('lblSubTotal').textContent = formatMoney(subtotal) + ' VNĐ';
        document.getElementById('lblVatTotal').textContent = formatMoney(vat) + ' VNĐ';
        document.getElementById('lblGrandTotal').textContent = formatMoney(grand) + ' VNĐ';
        document.getElementById('lblAmountInWords').textContent = docSoTiengViet(grand) + './.';
        return { subtotal: Math.round(subtotal), vat: Math.round(vat), grand, words: docSoTiengViet(grand) + './.' };
    }
    document.getElementById('productBody').addEventListener('input', calculateTotals);
    document.getElementById('vatRate').addEventListener('change', calculateTotals);

    // --- Product table ---
    function addRow(product = {}) {
        const docType = document.getElementById('documentType').value;
        const hidePrice = docType === 'BBBG' ? 'style="display:none"' : '';
        const tr = document.createElement('tr');
        tr.innerHTML = `
            <td class="border border-gray-300 p-1"><input type="text" name="prodName[]" placeholder="Túi/Màng gói hàng..." required class="w-full p-1.5 border-0 focus:ring-0"></td>
            <td class="border border-gray-300 p-1"><input type="text" name="prodSize[]" placeholder="28*42" class="w-full p-1.5 border-0 focus:ring-0"></td>
            <td class="border border-gray-300 p-1"><input type="text" name="prodUnit[]" value="Cuộn" class="w-full p-1.5 border-0 focus:ring-0"></td>
            <td class="border border-gray-300 p-1"><input type="number" name="prodQty[]" required class="w-full p-1.5 border-0 focus:ring-0"></td>
            <td class="border border-gray-300 p-1 col-price" ${hidePrice}><input type="number" name="prodPrice[]" class="w-full p-1.5 border-0 focus:ring-0"></td>
            <td class="border border-gray-300 p-1 col-price" ${hidePrice}><input type="number" name="prodDiscount[]" value="0" class="w-full p-1.5 border-0 focus:ring-0"></td>
            <td class="border border-gray-300 p-1 col-price" ${hidePrice}><input type="text" name="prodSubtotal[]" readonly value="0" class="w-full p-1.5 border-0 bg-gray-100 text-right font-semibold"></td>
            <td class="border border-gray-300 p-1 text-center"><button type="button" class="bg-red-500 text-white px-2 py-1 rounded text-xs font-bold" onclick="removeRow(this)">X</button></td>`;
        document.getElementById('productBody').appendChild(tr);
        const fields = { prodName: product.name, prodSize: product.size, prodUnit: product.unit, prodQty: product.qty, prodPrice: product.price, prodDiscount: product.discount };
        Object.entries(fields).forEach(([name, value]) => {
            if (value !== undefined) tr.querySelector(`[name="${name}[]"]`).value = value;
        });
        calculateTotals();
    }

    function removeRow(btn) {
        if (document.querySelectorAll('#productBody tr').length > 1) btn.closest('tr').remove();
    }

    // --- Saved companies (localStorage) ---
    function refreshCompanyDropdown() {
        const dd = document.getElementById('savedCompanies');
        dd.innerHTML = '<option value="">-- Chọn công ty đã lưu --</option>';
        const companies = JSON.parse(localStorage.getItem('saved_companies') || '{}');
        for (let key in companies) {
            const opt = document.createElement('option');
            opt.value = key;
            opt.textContent = key;
            dd.appendChild(opt);
        }
    }

    document.getElementById('savedCompanies').addEventListener('change', function() {
        const key = this.value;
        if (!key) return;
        const data = JSON.parse(localStorage.getItem('saved_companies') || '{}')[key];
        if (!data) return;
        if (data.shortName) document.getElementById('partnerShortName').value = data.shortName;
        document.getElementById('buyerCompany').value = data.company || '';
        document.getElementById('buyerRep').value = data.rep || '';
        document.getElementById('buyerRole').value = data.role || '';
        document.getElementById('buyerAddress').value = data.address || '';
        document.getElementById('buyerTaxCode').value = data.taxCode || '';
        document.getElementById('buyerPhone').value = data.phone || '';
        document.getElementById('buyerAccount').value = data.account || '';
        document.getElementById('buyerBank').value = data.bank || '';
        generateContractNo();
    });

    document.getElementById('btnSaveCompany').addEventListener('click', function() {
        const name = document.getElementById('buyerCompany').value.trim();
        if (!name) { showToast('Vui lòng điền Tên Công Ty trước khi lưu!', true); return; }
        const data = {
            shortName: document.getElementById('partnerShortName').value,
            company: name,
            rep: document.getElementById('buyerRep').value,
            role: document.getElementById('buyerRole').value,
            address: document.getElementById('buyerAddress').value,
            taxCode: document.getElementById('buyerTaxCode').value,
            phone: document.getElementById('buyerPhone').value,
            account: document.getElementById('buyerAccount').value,
            bank: document.getElementById('buyerBank').value
        };
        const companies = JSON.parse(localStorage.getItem('saved_companies') || '{}');
        companies[name] = data;
        localStorage.setItem('saved_companies', JSON.stringify(companies));
        refreshCompanyDropdown();
        document.getElementById('savedCompanies').value = name;
        showToast(`Đã lưu "${name}" vào bộ nhớ!`);
    });

    document.getElementById('btnDeleteCompany').addEventListener('click', function() {
        const key = document.getElementById('savedCompanies').value;
        if (!key) return;
        const companies = JSON.parse(localStorage.getItem('saved_companies') || '{}');
        delete companies[key];
        localStorage.setItem('saved_companies', JSON.stringify(companies));
        refreshCompanyDropdown();
        showToast(`Đã xóa "${key}" khỏi bộ nhớ.`);
    });

    // --- Toast ---
    function showToast(msg, isError) {
        const t = document.getElementById('toast');
        t.textContent = msg;
        t.className = 'toast px-6 py-3 rounded-lg shadow-lg font-medium ' + (isError ? 'bg-red-600 text-white' : 'bg-green-600 text-white');
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 3000);
    }

    // --- Products JSON ---
    function getProducts() {
        const names = document.querySelectorAll('input[name="prodName[]"]');
        const sizes = document.querySelectorAll('input[name="prodSize[]"]');
        const units = document.querySelectorAll('input[name="prodUnit[]"]');
        const qtys = document.querySelectorAll('input[name="prodQty[]"]');
        const prices = document.querySelectorAll('input[name="prodPrice[]"]');
        const discounts = document.querySelectorAll('input[name="prodDiscount[]"]');
        const subtotals = document.querySelectorAll('input[name="prodSubtotal[]"]');
        const products = [];
        for (let i = 0; i < names.length; i++) {
            products.push({ name: names[i].value, size: sizes[i].value, unit: units[i].value, qty: qtys[i].value, price: prices[i].value, discount: discounts[i].value, subtotal: subtotals[i] ? subtotals[i].value : '0' });
        }
        return JSON.stringify(products);
    }

    // --- Order presets ---
    function getSavedPresets() { return JSON.parse(localStorage.getItem('order_presets') || '{}'); }
    function refreshPresetDropdown() {
        const select = document.getElementById('presetSelect');
        select.innerHTML = '<option value="">-- Chọn đơn hàng mẫu đã lưu --</option>';
        Object.keys(getSavedPresets()).forEach(name => {
            const option = document.createElement('option'); option.value = name; option.textContent = name; select.appendChild(option);
        });
    }
    function collectPreset() {
        return {
            buyerCompany: document.getElementById('buyerCompany').value,
            vatRate: document.getElementById('vatRate').value,
            products: [...document.querySelectorAll('#productBody tr')].map(row => ({
                name: row.querySelector('[name="prodName[]"]').value, size: row.querySelector('[name="prodSize[]"]').value,
                unit: row.querySelector('[name="prodUnit[]"]').value, qty: row.querySelector('[name="prodQty[]"]').value,
                price: row.querySelector('[name="prodPrice[]"]').value, discount: row.querySelector('[name="prodDiscount[]"]').value
            }))
        };
    }
    function loadPreset() {
        const name = document.getElementById('presetSelect').value, data = getSavedPresets()[name]; if (!data) return;
        document.getElementById('buyerCompany').value = data.buyerCompany || '';
        document.getElementById('vatRate').value = data.vatRate || '8';
        document.getElementById('productBody').innerHTML = '';
        (data.products || []).forEach(product => addRow(product));
        calculateTotals(); showToast(`Đã tải đơn mẫu "${name}".`);
    }
    document.getElementById('presetSelect').addEventListener('change', loadPreset);
    document.getElementById('btnSavePreset').addEventListener('click', () => {
        const name = document.getElementById('presetNameInput').value.trim();
        if (!name) { showToast('Vui lòng nhập tên đơn mẫu!', true); return; }
        const presets = getSavedPresets(); presets[name] = collectPreset();
        localStorage.setItem('order_presets', JSON.stringify(presets));
        document.getElementById('presetNameInput').value = ''; refreshPresetDropdown(); showToast(`Đã lưu đơn mẫu "${name}".`);
    });
    document.getElementById('btnDeletePreset').addEventListener('click', () => {
        const select = document.getElementById('presetSelect'), name = select.value;
        if (!name) { showToast('Vui lòng chọn đơn mẫu cần xóa!', true); return; }
        const presets = getSavedPresets(); delete presets[name]; localStorage.setItem('order_presets', JSON.stringify(presets));
        refreshPresetDropdown(); showToast(`Đã xóa đơn mẫu "${name}".`);
    });

    // --- Word export ---
    function escapeWordText(value) {
        return String(value ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function exportWordDocument(docType = 'HDNT') {
        calculateTotals();
        const rows = [...document.querySelectorAll('#productBody tr')];
        const productRows = rows.map((row, index) => {
            const get = name => row.querySelector(`[name="${name}[]"]`)?.value || '';
            return `<tr><td>${index + 1}</td><td>${escapeWordText(get('prodName'))}</td><td>${escapeWordText(get('prodSize'))}</td><td>${escapeWordText(get('prodUnit'))}</td><td>${escapeWordText(get('prodQty'))}</td><td>${escapeWordText(get('prodPrice'))}</td><td>${escapeWordText(get('prodDiscount'))}%</td><td>${escapeWordText(get('prodSubtotal'))}</td></tr>`;
        }).join('');
        const contractNo = document.getElementById('contractNo').value || 'chua-co-so';
        const html = `<!doctype html><html><head><meta charset="utf-8"><style>body{font-family:Arial,sans-serif;color:#222}h1,h2,h3{text-align:center}table{width:100%;border-collapse:collapse}th,td{border:1px solid #777;padding:6px}th{background:#f2f2f2}td:nth-child(1),td:nth-child(4),td:nth-child(5),td:nth-child(7){text-align:center}td:nth-child(6),td:nth-child(8){text-align:right}</style></head><body><h2>CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</h2><h3>Độc lập - Tự do - Hạnh phúc</h3><h1>${docType === 'PO' ? 'ĐƠN ĐẶT HÀNG (PO)' : 'HỢP ĐỒNG NGUYÊN TẮC'}</h1><p><b>Số:</b> ${escapeWordText(contractNo)}</p><p><b>Bên mua (Bên A):</b> ${escapeWordText(document.getElementById('buyerCompany').value)}</p><table><thead><tr><th>STT</th><th>Tên hàng hóa / Quy cách</th><th>Kích thước</th><th>ĐVT</th><th>Số lượng</th><th>Đơn giá (VNĐ)</th><th>CK</th><th>Thành tiền (VNĐ)</th></tr></thead><tbody>${productRows}</tbody></table><p><b>Tổng tiền hàng:</b> ${escapeWordText(document.getElementById('lblSubTotal').textContent)}</p><p><b>Thuế VAT:</b> ${escapeWordText(document.getElementById('lblVatTotal').textContent)}</p><p><b>Tổng thanh toán:</b> ${escapeWordText(document.getElementById('lblGrandTotal').textContent)}</p><p><b>Số tiền bằng chữ:</b> <i>${escapeWordText(document.getElementById('lblAmountInWords').textContent)}</i></p></body></html>`;
        const blob = new Blob(['\\ufeff', html], { type: 'application/msword' });
        const link = document.createElement('a');
        link.href = URL.createObjectURL(blob);
        link.download = `Hop_Dong_${contractNo.replace(/[/\\?%*:|"<>]/g, '_')}.doc`;
        document.body.appendChild(link);
        link.click();
        link.remove();
        setTimeout(() => URL.revokeObjectURL(link.href), 1000);
        showToast('Đã tải file Word thành công!');
    }

    document.getElementById('exportWordBtn').addEventListener('click', () => exportWordDocument('HDNT'));
    document.getElementById('exportPoBtn').addEventListener('click', () => exportWordDocument('PO'));

    // --- Data SDK ---
    const dataHandler = { onDataChanged(data) {} };
    async function initApp() {
        const r = await window.dataSdk.init(dataHandler);
        if (!r.isOk) showToast('Lỗi kết nối lưu trữ dữ liệu', true);
    }
    initApp();

    document.getElementById('contractForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.style.opacity = '0.6';

        const record = {
            company: document.querySelector('input[name="company"]:checked').value,
            document_type: document.getElementById('documentType').value,
            contract_no: document.getElementById('contractNo').value,
            created_date: document.getElementById('createdDate').value,
            ref_contract_no: document.getElementById('refContractNo').value || '',
            buyer_company: document.getElementById('buyerCompany').value,
            buyer_rep: document.getElementById('buyerRep').value,
            buyer_role: document.getElementById('buyerRole').value,
            buyer_address: document.getElementById('buyerAddress').value,
            buyer_tax_code: document.getElementById('buyerTaxCode').value,
            buyer_phone: document.getElementById('buyerPhone').value,
            buyer_account: document.getElementById('buyerAccount').value,
            buyer_bank: document.getElementById('buyerBank').value,
            print_type: document.getElementById('printType').value,
            vat_rate: document.getElementById('vatRate').value,
            annual_volume: document.getElementById('annualVolume').value || '',
            commit_type: document.getElementById('commitType').value || '',
            cam_ket_bag_qty: document.getElementById('camKetBagQty').value || '',
            deposit_percent: document.getElementById('depositPercent').value || '',
            delivery_address: document.getElementById('deliveryAddress').value || '',
            delivery_date: document.getElementById('deliveryDate').value || '',
            products_json: getProducts(),
            subtotal: String(calculateTotals().subtotal),
            vat_amount: String(calculateTotals().vat),
            grand_total: String(calculateTotals().grand),
            amount_in_words: calculateTotals().words
        };

        const result = await window.dataSdk.create(record);
        btn.disabled = false;
        btn.style.opacity = '1';

        if (result.isOk) {
            showToast('Dữ liệu đã được lưu thành công!');
            e.target.reset();
            document.getElementById('createdDate').valueAsDate = new Date();
            handleFormChange();
        } else {
            showToast('Lỗi! Không thể lưu dữ liệu.', true);
        }
    });

    // Init
    refreshCompanyDropdown();
    refreshPresetDropdown();
    handleFormChange();
    calculateTotals();
</script>
 </body>
